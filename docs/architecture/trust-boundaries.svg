<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"><title>DevSecOps Trust Boundaries</title><desc>Logical view separating privileged control services, hostile-by-default builds, and protected deployment authority.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8da6bf"/></marker><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#f5f8fb}.meta{font-size:16px;fill:#9fb3c8}.head{font-size:20px;font-weight:700}.node{fill:#172331;stroke-width:2}.nt{font-size:18px;font-weight:700;fill:#f5f8fb}.ns{font-size:16px;fill:#b8c7d6}.flow{fill:none;stroke:#8da6bf;stroke-width:3;marker-end:url(#arrow)}.badge{fill:#0b1119;stroke:#8da6bf}.bid{font-size:15px;font-weight:700;fill:#fff;text-anchor:middle}.icon{fill:none;stroke:#eaf2f8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#0b1119"/><text x="45" y="55" class="title">DevSecOps Trust Boundaries</text><text x="45" y="88" class="meta">PUBLIC REFERENCE | Logical roles only | Generated from versioned JSON</text><rect x="45.0" y="130" width="361.0" height="630" rx="18" fill="#0f3b56" fill-opacity=".55" stroke="#45d0e8" stroke-width="2"/><text x="63.0" y="165" class="head" fill="#45d0e8">Control Boundary</text><rect class="node" x="61.0" y="200" width="329.0" height="112" rx="12" stroke="#45d0e8"/><g class="icon" transform="translate(95.0 243)"><path d="M-12-12h18l6 6v18h-24z"/><path d="M6-12v6h6M-6-3h12M-6 3h12"/></g><text x="123.0" y="241" class="nt">Source and CI</text><text x="123.0" y="271" class="ns">protected refs</text><rect class="node" x="61.0" y="365" width="329.0" height="112" rx="12" stroke="#45d0e8"/><g class="icon" transform="translate(95.0 408)"><path d="M-12-8l12-6 12 6-12 6zM-12-8v12l12 7 12-7V-8M0-2v13"/></g><text x="123.0" y="406" class="nt">Artifact Services</text><text x="123.0" y="436" class="ns">write after gates</text><rect class="node" x="61.0" y="530" width="329.0" height="112" rx="12" stroke="#45d0e8"/><g class="icon" transform="translate(95.0 573)"><circle cx="-6" cy="-3" r="7"/><path d="M0 2l13 13M7 9l4-4M10 12l4-4"/></g><text x="123.0" y="571" class="nt">Workload Identity</text><text x="123.0" y="601" class="ns">short TTL</text><rect x="428.0" y="130" width="361.0" height="630" rx="18" fill="#4b3510" fill-opacity=".55" stroke="#f5b942" stroke-width="2"/><text x="446.0" y="165" class="head" fill="#f5b942">Hostile Build Boundary</text><rect class="node" x="444.0" y="200" width="329.0" height="112" rx="12" stroke="#f5b942"/><g class="icon" transform="translate(478.0 243)"><rect x="-14" y="-10" width="28" height="19" rx="2"/><path d="M-7 14h14M0 9v5M-8-4h16M-8 2h10"/></g><text x="506.0" y="241" class="nt">Contributor Job</text><text x="506.0" y="271" class="ns">no deploy identity</text><rect class="node" x="444.0" y="365" width="329.0" height="112" rx="12" stroke="#f5b942"/><g class="icon" transform="translate(478.0 408)"><circle cx="-3" cy="-3" r="10"/><path d="M5 5l10 10"/></g><text x="506.0" y="406" class="nt">Security Scanners</text><text x="506.0" y="436" class="ns">independent results</text><rect class="node" x="444.0" y="530" width="329.0" height="112" rx="12" stroke="#f5b942"/><g class="icon" transform="translate(478.0 573)"><path d="M-13-8l13-7 13 7v16L0 15-13 8zM-13-8L0 0l13-8M0 0v15"/></g><text x="506.0" y="571" class="nt">Approved Dependencies</text><text x="506.0" y="601" class="ns">proxied sources</text><rect x="811.0" y="130" width="361.0" height="630" rx="18" fill="#123f32" fill-opacity=".55" stroke="#4ee0a1" stroke-width="2"/><text x="829.0" y="165" class="head" fill="#4ee0a1">Protected Deploy Boundary</text><rect class="node" x="827.0" y="200" width="329.0" height="112" rx="12" stroke="#4ee0a1"/><g class="icon" transform="translate(861.0 243)"><path d="M0-14l12 5v8c0 8-5 13-12 16-