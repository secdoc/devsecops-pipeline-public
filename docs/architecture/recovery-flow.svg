<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"><title>Backup and Isolated Recovery Flow</title><desc>Recovery view for control data, artifact storage, policies, identities, and clean worker rebuilds.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8da6bf"/></marker><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#f5f8fb}.meta{font-size:16px;fill:#9fb3c8}.head{font-size:20px;font-weight:700}.node{fill:#172331;stroke-width:2}.nt{font-size:18px;font-weight:700;fill:#f5f8fb}.ns{font-size:16px;fill:#b8c7d6}.flow{fill:none;stroke:#8da6bf;stroke-width:3;marker-end:url(#arrow)}.badge{fill:#0b1119;stroke:#8da6bf}.bid{font-size:15px;font-weight:700;fill:#fff;text-anchor:middle}.icon{fill:none;stroke:#eaf2f8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#0b1119"/><text x="45" y="55" class="title">Backup and Isolated Recovery Flow</text><text x="45" y="88" class="meta">PUBLIC REFERENCE | Logical roles only | Generated from versioned JSON</text><rect x="45.0" y="130" width="361.0" height="630" rx="18" fill="#0f3b56" fill-opacity=".55" stroke="#45d0e8" stroke-width="2"/><text x="63.0" y="165" class="head" fill="#45d0e8">Protected Sources</text><rect class="node" x="61.0" y="200" width="329.0" height="112" rx="12" stroke="#45d0e8"/><g class="icon" transform="translate(95.0 243)"><path d="M-12-12h18l6 6v18h-24z"/><path d="M6-12v6h6M-6-3h12M-6 3h12"/></g><text x="123.0" y="241" class="nt">GitLab State</text><text x="123.0" y="271" class="ns">repositories and DB</text><rect class="node" x="61.0" y="365" width="329.0" height="112" rx="12" stroke="#45d0e8"/><g class="icon" transform="translate(95.0 408)"><path d="M-12-8l12-6 12 6-12 6zM-12-8v12l12 7 12-7V-8M0-2v13"/></g><text x="123.0" y="406" class="nt">