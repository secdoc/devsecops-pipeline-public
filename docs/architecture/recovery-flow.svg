 cy="338.5" r="13"/><text class="bid" x="991.5" y="343.5">6</text><path class="flow" d="M 1156.0 421.0 V 800.0 H 1210.0 V 256.0"/><circle class="badge" cx="1183.0" cy="800.0" r="13"/><text class="bid" x="1183.0" y="805.0">7</text><path class="flow" d="M 1374.5 312.0 V 365.0"/><circle class="badge" cx="1374.5" cy="338.5" r="13"/><text class="bid" x="1374.5" y="343.5">8</text><text x="45" y="825" class="meta">Control intent: separate identities, deny by default, immutable promotion, exact evidence, fail-closed publication.</text><text x="45" y="858" class="meta">Excludes live addresses, hostnames, infrastructure IDs, credentials, and operational evidence.</text></svg>
