<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"><title>Immutable Artifact and Evidence Flow</title><desc>Build-once promotion from source revision through SBOM, scanning, policy, signature, provenance, and deployment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8da6bf"/></marker><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#f5f8fb}.meta{font-size:16px;fill:#9fb3c8}.head{font-size:20px;font-weight:700}.node{fill:#172331;stroke-width:2}.nt{font-size:18px;font-weight:700;fill:#f5f8fb}.ns{font-size:16px;fill:#b8c7d6}.flow{fill:none;stroke:#8da6bf;stroke-width:3;marker-end:url(#arrow)}.badge{fill:#0b1119;stroke:#8da6bf}.bid{font-size:15px;font-weight:700;fill:#fff;text-anchor:middle}.icon{fill:none;stroke:#eaf2f8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#0b1119"/><text x="45" y="55" class="title">Immutable Artifact and Evidence Flow</text><text x="45" y="88" class="meta">PUBLIC REFERENCE | Logical roles only | Generated from versioned JSON</text><rect x="45.0" y="130" width="361.0" height="630" rx="18" fill="#0f3b56" fill-opacity=".55" stroke="#45d0e8" stroke-width="2"/><text x="63.0" y="165" class="head" fill="#45d0e8">Source</text><rect class="node" x="61.0" y="200" width="329.0" height="112" rx="12" stroke="#45d0e8"/><g class="icon" transform="translate(95.0 243)"><path d="M-12-12h18l6 6v18h-24z"/><path d="M6-12v6h6M-6-3h12M-6 3h12"/></g><text x="123.0" y="241" class="nt">Reviewed Revision</text><text x="123.0" y="271" class="ns">immutable commit</text><rect x="428.0" y="130" width="361.0" height="630" rx="18" fill="#4b3510" fill-opacity=".55" stroke="#f5b942" stroke-width="2"/><text x="446.0" y="165" class="head" fill="#f5b942">Build</text><rect class="node" x="444.0" y="200" width="329.0" height="112" rx="12" stroke="#f5b942"/><g class="icon" transform="translate(478.0 243)"><rect x="-14" y="-10" width="28" height="19" rx="2"/><path d="M-7 14h14M0 9v5M-8-4h16M-8 2h10"/></g><text x="506.0" y="241" class="nt">Single Build</text><text x="506.0" y="271" class="ns">reproducible input</text><rect class="node" x="444.0" y="365" width="329.0" height="112" rx="12" stroke="#f5b942"/><g class="icon" transform="translate(478.0 408)"><path d="M-13-8l13-7 13 7v16L0 15-13 8zM-13-8L0 0l13-8M0 0v15"/></g><text x="506.0" y="406" class="nt">Artifact Digest</text><text x="506.0" y="436" class="ns">SHA-256 identity</text><rect x="811.0" y="130" width="361.0" height="630" rx="18" fill="#45203d" fill-opacity=".55" stroke="#f078c6" stroke-width="2"/><text x="829.0" y="165" class="head" fill="#f078c6">Assurance</text><rect class="node" x="827.0" y="200" width="329.0" height="112" rx="12" stroke="#f078c6"/><g class="icon" transform="translate(861.0 243)"><path d="M-11-14h14l8 8v20h-22zM3-14v8h8M-5 1h10M-5 7h10"/></g><text x="889.0" y="241" class="nt">CycloneDX SBOM</text><text x="889.0" y="271" class="ns">bound to digest</text><rect class="node" x="827.0" y="365" width="329.0" height="112" rx="12" stroke="#f078c6"/><g class="icon" transform="translate(861.0 408)"><circle cx="-3" cy="-3" r="10"/><path d="M5 5l10 10"/></g><text x="889.0" y="406" class="nt">Independent Scans</text><text x="889.0" y="436" class="ns">normalized findings</text><rect class="node" x="827.0" y="530" width="329.0" height="112" rx="12" stroke="#f078c6"/><g class="icon" transform="translate(861.0 573)"><path d="M0-14l12 5v8c0 8-5 13-12 16-7-3-12-8-12-16v-8z"/><path d="M-5 0l4 4 7-9"/></g><text x="889.0" y="571" class="nt">Policy Decision</text><text x="889.0" y="601" class="ns">reason codes</text><rect x="1194.0" y="130" width="361.0" height="630" rx="18" fill="#123f32" fill-opacity=".55" stroke="#4ee0a1" stroke-width="2"/><text x="1212.0" y="165" class="head" fill="#4ee0a1">Release</text><rect class="node" x="1210.0" y="200" width="329.0" height="112" rx="12" stroke="#4ee0a1"/><g class="icon" transform="translate(1244.0 243)"><circle cx="-6" cy="-3" r="7"/><path d="M0 2l13 13M7 9l4-4M10 12l4-4"/></g><text x="1272.0" y="241" class="nt">Signature and Provenance</text><text x="1272.0" y="271" class="ns">approved digest</text><rect class="node" x="1210.0" y="365" width="329.0" height="112" rx="12" stroke="#4ee0a1"/><g class="icon" transform="translate(1244.0 408)"><path d="M-11-14h14l8 8v20h-22zM3-14v8h8M-5 1h10M-5 7h10"/></g><text x="1272.0" y="406" class="nt">Release Receipt</text><text x="1272.0" y="436" class="ns">all evidence hashes</text><rect class="node" x="1210.0" y="530" width="329.0" height="112" rx="12" stroke="#4ee0a1"/><g class="icon" transform="translate(1244.0 573)"><rect x="-14" y="-13" width="28" height="10" rx="2"/><rect x="-14" y="2" width="28" height="10" rx="2"/><circle cx="8" cy="-8" r="1"/><circle cx="8" cy="7" r="1"/></g><text x="1272.0" y="571" class="nt">Deploy Same Digest</text><text x="1272.0" y="601" class="ns">never rebuild</text><path class="flow" d="M 390.0 256.0 H 444.0"/><circle class="badge" cx="417.0" cy="256.0" r="13"/><text class="bid" x="417.0" y="261.0">1</text><path class="flow" d="M 608.5 312.0 V 365.0"/><circle class="badge" cx="608.5" cy="338.5" r="13"/><text class="bid" x="608.5" y="343.5">2</text><path class="flow" d="M 773.0 421.0 V 780.0 H 827.0 V 256.0"/><circle class="badge" cx="800.0" cy="780.0" r="13"/><text class="bid" x="800.0" y="785.0">3</text><path class="flow" d="M 991.5 312.0 V 365.0"/><circle class="badge" cx="991.5" cy="338.5" r="13"/><text class="bid" x="991.5" y="343.5">4</text><path class="flow" d="M 991.5 477.0 V 530.0"/><circle class="badge" cx="991.5" cy="503.5" r="13"/><text class="bid" x="991.5" y="508.5">5</text><path class="flow" d="M 1156.0 586.0 V 795.0 H 1210.0 V 256.0"/><circle class="badge" cx="1183.0" cy="795.0" r="13"/><text class="bid" x="1183.0" y="800.0">6</text><path class="flow" d="M 1374.5 312.0 V 365.0"/><circle class="badge" cx="1374.5" cy="338.5" r="13"/><text class="bid" x="1374.5" y="343.5">7</text><path class="flow" d="M 1374.5 477.0 V 530.0"/><circle class="badge" cx="1374.5" cy="503.5" r="13"/><text class="bid" x="1374.5" y="508.5">8</text><text x="45" y="825" class="meta">Control intent: separate identities, deny by default, immutable promotion, exact evidence, fail-closed publication.</text><text x="45" y="858" class="meta">Excludes live addresses, hostnames, infrastructure IDs, credentials, and operational evidence.</text></svg>
